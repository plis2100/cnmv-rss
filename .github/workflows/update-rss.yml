name: Actualizar RSS CNMV

on:
  workflow_dispatch:

  schedule:
    # Cada hora de lunes a viernes.
    # GitHub utiliza UTC.
    - cron: "0 5-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-cnmv
  cancel-in-progress: false

jobs:

  actualizar:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Comprobar horario España
        id: horario
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}

        run: |

          echo "Evento: $EVENTO"

          echo "Fecha UTC:"
          date

          echo "Fecha España:"
          TZ=Europe/Madrid date


          if [ "$EVENTO" = "workflow_dispatch" ]; then

            echo "Ejecución manual"

            echo "ejecutar=si" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          DIA=$(TZ=Europe/Madrid date +%u)

          HORA=$(TZ=Europe/Madrid date +%H)


          echo "Día semana: $DIA"

          echo "Hora España: $HORA"


          if [ "$DIA" -ge 1 ] && \
             [ "$DIA" -le 5 ] && \
             [ "$HORA" -ge 7 ] && \
             [ "$HORA" -le 22 ]; then

            echo "Dentro del horario"

            echo "ejecutar=si" >> "$GITHUB_OUTPUT"

          else

            echo "Fuera del horario"

            echo "ejecutar=no" >> "$GITHUB_OUTPUT"

          fi


      - name: Descargar repositorio

        if: steps.horario.outputs.ejecutar == 'si'

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Configurar Python

        if: steps.horario.outputs.ejecutar == 'si'

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"
          cache: pip


      - name: Actualizar pip

        if: steps.horario.outputs.ejecutar == 'si'

        run: |

          python -m pip install --upgrade pip


      - name: Instalar dependencias

        if: steps.horario.outputs.ejecutar == 'si'

        run: |

          pip install -r requirements.txt


      - name: Ejecutar CNMV

        if: steps.horario.outputs.ejecutar == 'si'

        env:

          PYTHONUNBUFFERED: "1"

        run: |

          echo "======================================"
          echo "INICIANDO CONSULTA CNMV"
          echo "======================================"

          python main.py --keep_days 5


      - name: Comprobar feed

        if: steps.horario.outputs.ejecutar == 'si'

        shell: bash

        run: |

          echo "======================================"
          echo "COMPROBANDO FEED"
          echo "======================================"


          if [ ! -f feed.xml ]; then

            echo "ERROR"

            echo "main.py NO ha generado feed.xml"

            exit 1

          fi


          echo "feed.xml generado"


          echo ""

          echo "Tamaño:"

          ls -lh feed.xml


          echo ""

          echo "Items encontrados:"

          grep -c "<item>" feed.xml || true


          echo ""

          echo "Fechas encontradas en el feed:"

          grep -oE \
          '[0-9]{2}/[0-9]{2}/[0-9]{4}' \
          feed.xml \
          | sort \
          | uniq \
          | tail -20 \
          || true


          echo ""

          echo "Primeros títulos:"

          grep "<title>" feed.xml \
          | head -20 \
          || true


      - name: Ver archivos modificados

        if: steps.horario.outputs.ejecutar == 'si'

        run: |

          echo "======================================"
          echo "ARCHIVOS MODIFICADOS"
          echo "======================================"

          git status --short


      - name: Guardar cambios

        if: steps.horario.outputs.ejecutar == 'si'

        shell: bash

        run: |

          git config \
          user.name \
          "github-actions[bot]"

          git config \
          user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          git add feed.xml


          if [ -d resultados ]; then

            git add resultados/

          fi


          if git diff --cached --quiet; then

            echo ""
            echo "======================================"
            echo "NO HAY CAMBIOS"
            echo "======================================"
            echo ""

            exit 0

          fi


          echo ""
          echo "======================================"
          echo "NUEVAS NOTIFICACIONES DETECTADAS"
          echo "======================================"
          echo ""


          git diff \
          --cached \
          --stat


          git commit \
          -m "Actualizar RSS CNMV $(TZ=Europe/Madrid date '+%d-%m-%Y %H:%M')"


          git pull \
          --rebase \
          origin \
          main


          git push \
          origin \
          main
